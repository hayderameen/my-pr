  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const equipType = params.get('type') || 'barbell';
      const exName = params.get('name') || 'Barbell Bench Press';
      const targetWeight = parseFloat(params.get('weight')) || 105;
      const targetReps = parseInt(params.get('reps'), 10) || 5;
      const prDate = params.get('date') || 'Nov 18';

      const titleEl = document.getElementById('exercise-title');
      if (titleEl) titleEl.textContent = exName;

      const dateBadge = document.getElementById('pr-date-badge');
      if (dateBadge) {
        const span = dateBadge.querySelector('span:last-child');
        if (span) span.textContent = 'Verified PR • ' + prDate;
      }

      const stepPill = document.getElementById('pr-step-pill');
      if (stepPill) stepPill.textContent = targetReps + ' reps';

      const readout = document.getElementById('pr-weight-readout');
      const layer = document.getElementById('pr-3d-layer');
      const ns = 'http://www.w3.org/2000/svg';

      function el(tag, attrs) {
        const node = document.createElementNS(ns, tag);
        for (const k in attrs) node.setAttribute(k, attrs[k]);
        return node;
      }

      function computePlates(weight) {
        let rem = Math.max(0, (weight - 20) / 2);
        const denoms = [
          { kg: 25,   h: 78, w: 14, fill: 'url(#hs-red-3d)',    rim: '#FCA5A5' },
          { kg: 20,   h: 74, w: 13, fill: 'url(#hs-blue-3d)',   rim: '#93C5FD' },
          { kg: 15,   h: 64, w: 12, fill: 'url(#hs-yellow-3d)', rim: '#FDE047' },
          { kg: 10,   h: 54, w: 10, fill: 'url(#hs-green-3d)',  rim: '#86EFAC' },
          { kg: 5,    h: 42, w: 8,  fill: 'url(#hs-collar-3d)', rim: '#CBD5E1' },
          { kg: 2.5,  h: 34, w: 7,  fill: 'url(#hs-iron-3d)',   rim: '#64748B' },
          { kg: 1.25, h: 26, w: 6,  fill: 'url(#hs-collar-3d)', rim: '#E2E8F0' }
        ];
        const list = [];
        for (const d of denoms) {
          while (rem >= d.kg - 0.01 && list.length < 5) {
            list.push(d);
            rem -= d.kg;
          }
        }
        return list;
      }

      let animTimers = [];

      function clearTimers() {
        animTimers.forEach(clearTimeout);
        animTimers = [];
      }

      function render3D(animate) {
        if (!layer) return;
        clearTimers();
        while (layer.firstChild) layer.removeChild(layer.firstChild);

        if (equipType === 'dumbbell') {
          const count = Math.max(2, Math.min(5, Math.round(targetWeight / 7)));
          layer.appendChild(el('rect', { x: 118, y: 55, width: 84, height: 10, rx: 3, fill: 'url(#steel-bar-3d)' }));
          const stepWeight = targetWeight / count;
          if (animate && readout) readout.textContent = '0.0';
          for (let i = 0; i < count; i++) {
            const h = 58 - (i === count - 1 ? 8 : 0);
            const gap = i * 11;
            const g = el('g', { class: 'plate-3d', style: 'transform-box: fill-box; transform-origin: center;' });
            // 3D depth edge + front face left & right
            g.appendChild(el('rect', { x: 104 - gap, y: 60 - h / 2, width: 11, height: h, rx: 3, fill: 'url(#hs-iron-3d)', stroke: '#64748B', 'stroke-width': '0.8' }));
            g.appendChild(el('rect', { x: 205 + gap, y: 60 - h / 2, width: 11, height: h, rx: 3, fill: 'url(#hs-iron-3d)', stroke: '#64748B', 'stroke-width': '0.8' }));
            if (animate) {
              g.style.opacity = '0';
              g.style.transform = 'translateX(18px) scale(0.92)';
              const t = setTimeout(function () {
                g.style.opacity = '1';
                g.style.transform = 'translateX(0) scale(1)';
                if (readout) readout.textContent = Math.min(targetWeight, (i + 1) * stepWeight).toFixed(1);
              }, 160 * (i + 1));
              animTimers.push(t);
            }
            layer.appendChild(g);
          }
          if (!animate && readout) readout.textContent = targetWeight.toFixed(1);
          return;
        }

        if (equipType === 'cable') {
          const activeIdx = Math.max(0, Math.min(6, Math.round((targetWeight - 10) / 10)));
          if (animate && readout) readout.textContent = '10.0';
          for (let i = 0; i < 7; i++) {
            const y = 14 + i * 13;
            const isSelected = i === activeIdx;
            const plate = el('rect', {
              x: 112, y: y, width: 96, height: 10, rx: 3,
              fill: isSelected ? 'url(#hs-red-3d)' : (i < activeIdx ? 'url(#hs-iron-3d)' : '#CBD5E1'),
              stroke: isSelected ? '#FCA5A5' : '#94A3B8', 'stroke-width': '0.6'
            });
            layer.appendChild(plate);
            if (isSelected) {
              const pin = el('circle', { cx: 160, cy: y + 5, r: 3.5, fill: '#FFFFFF', class: 'plate-3d', style: 'transform-box: fill-box; transform-origin: center;' });
              if (animate) {
                pin.style.opacity = '0';
                pin.style.transform = 'translateY(-16px)';
                const t = setTimeout(function () {
                  pin.style.opacity = '1';
                  pin.style.transform = 'translateY(0)';
                  if (readout) readout.textContent = targetWeight.toFixed(1);
                }, 420);
                animTimers.push(t);
              }
              layer.appendChild(pin);
            }
          }
          if (!animate && readout) readout.textContent = targetWeight.toFixed(1);
          return;
        }

        // Barbell 3D sleeve + shaft + sequential plate load
        layer.appendChild(el('rect', { x: 16, y: 54, width: 64, height: 12, rx: 3, fill: 'url(#hs-collar-3d)' }));
        layer.appendChild(el('rect', { x: 240, y: 54, width: 64, height: 12, rx: 3, fill: 'url(#hs-collar-3d)' }));
        layer.appendChild(el('path', { d: 'M 80 60 L 240 60', stroke: 'url(#steel-bar-3d)', 'stroke-width': '6', 'stroke-linecap': 'round', fill: 'none' }));
        layer.appendChild(el('rect', { x: 76, y: 46, width: 7, height: 28, rx: 2, fill: 'url(#hs-collar-3d)' }));
        layer.appendChild(el('rect', { x: 237, y: 46, width: 7, height: 28, rx: 2, fill: 'url(#hs-collar-3d)' }));

        const plates = computePlates(targetWeight);
        let runningWeight = 20;
        if (animate && readout) readout.textContent = '20.0';

        let offset = 0;
        plates.forEach(function (p, idx) {
          const lx = 73 - offset - p.w;
          const rx = 247 + offset;
          const py = 60 - p.h / 2;

          const g = el('g', { class: 'plate-3d', style: 'transform-box: fill-box; transform-origin: center;' });
          // 3D depth rim + front face
          g.appendChild(el('rect', { x: lx - 2, y: py + 1, width: p.w + 2, height: p.h - 2, rx: 3, fill: '#0F172A', opacity: '0.35' }));
          g.appendChild(el('rect', { x: lx, y: py, width: p.w, height: p.h, rx: 3, fill: p.fill, stroke: p.rim, 'stroke-width': '0.7' }));
          g.appendChild(el('rect', { x: rx, y: py + 1, width: p.w + 2, height: p.h - 2, rx: 3, fill: '#0F172A', opacity: '0.35' }));
          g.appendChild(el('rect', { x: rx, y: py, width: p.w, height: p.h, rx: 3, fill: p.fill, stroke: p.rim, 'stroke-width': '0.7' }));

          if (animate) {
            g.style.opacity = '0';
            g.style.transform = 'scale(1.12)';
            const stepTotal = runningWeight + p.kg * 2;
            const t = setTimeout(function () {
              g.style.opacity = '1';
              g.style.transform = 'scale(1)';
              if (readout) readout.textContent = stepTotal.toFixed(1);
            }, 220 * (idx + 1));
            animTimers.push(t);
          }

          runningWeight += p.kg * 2;
          offset += p.w + 3;
          layer.appendChild(g);
        });

        if (plates.length > 0) {
          const collars = el('g', { class: 'plate-3d', style: 'transform-box: fill-box; transform-origin: center;' });
          collars.appendChild(el('rect', { x: 73 - offset - 5, y: 50, width: 5, height: 20, rx: 1.5, fill: 'url(#hs-collar-3d)' }));
          collars.appendChild(el('rect', { x: 247 + offset, y: 50, width: 5, height: 20, rx: 1.5, fill: 'url(#hs-collar-3d)' }));
          if (animate) {
            collars.style.opacity = '0';
            const tc = setTimeout(function () {
              collars.style.opacity = '1';
              if (readout) readout.textContent = targetWeight.toFixed(1);
            }, 220 * (plates.length + 1));
            animTimers.push(tc);
          }
          layer.appendChild(collars);
        }

        if (!animate && readout) readout.textContent = targetWeight.toFixed(1);
      }

      // Render final state immediately for static snapshots, then replay on button click
      render3D(false);

      const replayBtn = document.getElementById('replay-btn');
      if (replayBtn) {
        replayBtn.addEventListener('click', function () {
          render3D(true);
        });
      }

      // Progress Graph toggle
      const toggleBtn = document.getElementById('toggle-graph-btn');
      const toggleLabel = document.getElementById('toggle-graph-label');
      const graphCard = document.getElementById('progress-graph-card');
      if (toggleBtn && graphCard && toggleLabel) {
        toggleBtn.addEventListener('click', function () {
          const isHidden = graphCard.classList.toggle('hidden');
          toggleBtn.setAttribute('aria-expanded', String(!isHidden));
          toggleLabel.textContent = isHidden ? 'Show Progress Graph' : 'Hide Progress Graph';
        });
      }

      // Period data & SVG chart
      const periodData = {
        '1M':  { delta: '+5.0 kg over 1M',  labels: ['W1', 'W2', 'W3', 'W4'],       vals: [targetWeight - 5, targetWeight - 2.5, targetWeight - 2.5, targetWeight] },
        '3M':  { delta: '+12.5 kg over 3M', labels: ['Sep', 'Oct', 'Nov', 'Now'],     vals: [targetWeight - 12.5, targetWeight - 7.5, targetWeight - 2.5, targetWeight] },
        '6M':  { delta: '+20.0 kg over 6M', labels: ['Jun', 'Aug', 'Oct', 'Now'],     vals: [targetWeight - 20, targetWeight - 15, targetWeight - 5, targetWeight] },
        '1Y':  { delta: '+30.0 kg over 1Y', labels: ['Q1', 'Q2', 'Q3', 'Now'],        vals: [targetWeight - 30, targetWeight - 20, targetWeight - 10, targetWeight] },
        'All': { delta: '+45.0 kg all-time', labels: ['2024', '2025', 'Mid', 'Now'],  vals: [Math.max(20, targetWeight - 45), Math.max(20, targetWeight - 27.5), targetWeight - 12.5, targetWeight] }
      };

      function renderChart(periodKey) {
        const data = periodData[periodKey] || periodData['3M'];
        const deltaEl = document.getElementById('graph-delta');
        if (deltaEl) deltaEl.textContent = data.delta;

        const grid = document.getElementById('chart-grid');
        const fill = document.getElementById('chart-fill');
        const line = document.getElementById('chart-line');
        const pts = document.getElementById('chart-points');
        if (!grid || !fill || !line || !pts) return;

        while (grid.firstChild) grid.removeChild(grid.firstChild);
        while (pts.firstChild) pts.removeChild(pts.firstChild);

        const w = 278;
        const h = 104;
        const padL = 24;
        const padT = 14;
        const minV = Math.min.apply(null, data.vals) - 5;
        const maxV = Math.max.apply(null, data.vals) + 2.5;
        const range = Math.max(5, maxV - minV);

        for (let g = 0; g < 3; g++) {
          const y = padT + (h / 2) * g;
          grid.appendChild(el('line', { x1: padL, y1: y, x2: padL + w, y2: y, stroke: '#E4BEB5', 'stroke-width': '1', 'stroke-dasharray': '3 3' }));
        }

        const coords = data.vals.map(function (v, i) {
          const x = padL + (w / (data.vals.length - 1)) * i;
          const y = padT + h - ((v - minV) / range) * h;
          return { x: x, y: y, v: v, label: data.labels[i] };
        });

        let d = 'M ' + coords[0].x + ' ' + coords[0].y;
        for (let i = 1; i < coords.length; i++) {
          d += ' L ' + coords[i].x + ' ' + coords[i].y;
        }
        line.setAttribute('d', d);
        fill.setAttribute('d', d + ' L ' + coords[coords.length - 1].x + ' ' + (padT + h) + ' L ' + coords[0].x + ' ' + (padT + h) + ' Z');

        coords.forEach(function (c, i) {
          const isLast = i === coords.length - 1;
          pts.appendChild(el('circle', {
            cx: c.x, cy: c.y, r: isLast ? 5 : 4,
            fill: isLast ? '#B22200' : '#FFFFFF',
            stroke: '#B22200', 'stroke-width': '2.5'
          }));
          const lbl = el('text', {
            x: c.x, y: padT + h + 20,
            'text-anchor': 'middle',
            fill: '#5B403A',
            'font-size': '11',
            'font-family': 'Spline Sans Mono, monospace'
          });
          lbl.textContent = c.label;
          pts.appendChild(lbl);
        });
      }

      renderChart('3M');

      const periodPills = Array.from(document.querySelectorAll('.period-pill'));
      periodPills.forEach(function (pill) {
        pill.addEventListener('click', function () {
          const p = pill.getAttribute('data-period');
          periodPills.forEach(function (other) {
            const active = other === pill;
            other.setAttribute('aria-selected', String(active));
            other.className = active
              ? 'period-pill py-gutter-xs rounded-full bg-light-primary text-light-on-primary font-label text-label-sm'
              : 'period-pill py-gutter-xs rounded-full bg-light-surface-container-low border border-light-outline-variant text-light-on-surface font-label text-label-sm';
          });
          renderChart(p);
        });
      });
    })();
  </script>


</body></html>
