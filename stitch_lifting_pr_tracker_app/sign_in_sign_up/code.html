<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <div class="min-h-[884px] max-w-md mx-auto flex flex-col justify-between px-page-margin py-gutter-xl bg-light-surface" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Brand Header -->
    <header class="flex flex-col gap-gutter-lg pt-gutter-lg">
      <div class="flex items-center gap-gutter-sm">
        <span class="w-10 h-10 rounded-md bg-light-primary text-light-on-primary inline-flex items-center justify-center">
          <span class="material-symbols-outlined" aria-hidden="true">fitness_center</span>
        </span>
        <span class="font-headline text-headline-md text-light-on-surface" data-design-text-token="headline-md">LiftMark</span>
      </div>
      <div class="flex flex-col gap-gutter-xs">
        <h1 id="auth-heading" class="font-display text-display-lg-mobile text-light-on-surface text-balance" data-design-text-token="display-lg-mobile">Welcome back</h1>
        <p id="auth-sub" class="font-body text-body-md text-light-on-surface-variant text-pretty" data-design-text-token="body-md">Sign in to keep your workout days and PR history synced.</p>
      </div>
    </header>

    <!-- Auth Form Card -->
    <main class="flex-1 flex flex-col justify-center py-gutter-xl gap-gutter-lg">

      <!-- Mode Switcher (Sign In / Sign Up) -->
      <div class="grid grid-cols-2 gap-gutter-xs p-gutter-xs rounded-full bg-light-surface-container-low border border-light-outline-variant" role="tablist" aria-label="Authentication mode">
        <button id="tab-signin" type="button" role="tab" aria-selected="true" class="py-gutter-sm px-gutter-md rounded-full bg-light-surface-container-lowest text-light-on-surface font-label text-label-lg border border-light-outline-variant/60 transition-colors duration-state-change ease-state-change">
          <span data-design-text-token="label-lg">Sign In</span>
        </button>
        <button id="tab-signup" type="button" role="tab" aria-selected="false" class="py-gutter-sm px-gutter-md rounded-full text-light-on-surface-variant font-label text-label-lg transition-colors duration-state-change ease-state-change">
          <span data-design-text-token="label-lg">Create Account</span>
        </button>
      </div>

      <!-- Inputs -->
      <form action="../onboarding-units/OnboardingUnits.html" class="bg-light-surface-container-lowest border border-light-outline-variant rounded-xl p-gutter-xl flex flex-col gap-gutter-lg">

        <label class="flex flex-col gap-gutter-xs">
          <span class="font-label text-label-lg text-light-on-surface" data-design-text-token="label-lg">Username</span>
          <input type="text" autocomplete="username" placeholder="alex_lifts" value="alex_lifts" class="w-full rounded-md border border-light-outline-variant bg-light-surface text-light-on-surface px-gutter-md py-gutter-md font-body text-body-md focus:border-light-primary focus:ring-light-primary">
        </label>

        <label class="flex flex-col gap-gutter-xs">
          <div class="flex items-center justify-between">
            <span class="font-label text-label-lg text-light-on-surface" data-design-text-token="label-lg">Password</span>
            <a id="forgot-link" href="../onboarding-units/OnboardingUnits.html" class="font-label text-label-sm text-light-primary" data-design-text-token="label-sm">Forgot password?</a>
          </div>
          <div class="relative flex items-center">
            <input id="password-input" type="password" value="••••••••••••" class="w-full rounded-md border border-light-outline-variant bg-light-surface text-light-on-surface px-gutter-md py-gutter-md pr-12 font-body text-body-md focus:border-light-primary focus:ring-light-primary">
            <button id="toggle-pw" type="button" aria-label="Show password" class="absolute right-3 text-light-on-surface-variant hover:text-light-on-surface p-gutter-xs">
              <span id="pw-icon" class="material-symbols-outlined" aria-hidden="true">visibility</span>
            </button>
          </div>
        </label>

        <a href="../onboarding-units/OnboardingUnits.html" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center gap-gutter-sm bg-light-primary text-light-on-primary px-gutter-xl py-gutter-lg rounded-full font-label text-label-lg transition-transform duration-state-change ease-state-change hover:bg-light-primary-container active:scale-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary">
          <span id="submit-label" data-design-text-token="label-lg">Sign In</span>
        </a>

      </form>

    </main>

    <!-- Bottom Legal Note -->
    <footer class="text-center pb-gutter-sm">
      <p class="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">Synced across Android &amp; iOS</p>
    </footer>

  </div>

  <script>
    (function () {
      const tabSignIn = document.getElementById('tab-signin');
      const tabSignUp = document.getElementById('tab-signup');
      const heading = document.getElementById('auth-heading');
      const sub = document.getElementById('auth-sub');
      const submitLabel = document.getElementById('submit-label');
      const forgotLink = document.getElementById('forgot-link');
      const pwInput = document.getElementById('password-input');
      const togglePw = document.getElementById('toggle-pw');
      const pwIcon = document.getElementById('pw-icon');

      function setMode(isSignUp) {
        tabSignIn.setAttribute('aria-selected', String(!isSignUp));
        tabSignUp.setAttribute('aria-selected', String(isSignUp));
        if (isSignUp) {
          tabSignUp.className = 'py-gutter-sm px-gutter-md rounded-full bg-light-surface-container-lowest text-light-on-surface font-label text-label-lg border border-light-outline-variant/60 transition-colors duration-state-change ease-state-change';
          tabSignIn.className = 'py-gutter-sm px-gutter-md rounded-full text-light-on-surface-variant font-label text-label-lg transition-colors duration-state-change ease-state-change';
          heading.textContent = 'Create your account';
          sub.textContent = 'Set up your profile once and start logging PRs in seconds.';
          submitLabel.textContent = 'Create Account';
          forgotLink.classList.add('hidden');
        } else {
          tabSignIn.className = 'py-gutter-sm px-gutter-md rounded-full bg-light-surface-container-lowest text-light-on-surface font-label text-label-lg border border-light-outline-variant/60 transition-colors duration-state-change ease-state-change';
          tabSignUp.className = 'py-gutter-sm px-gutter-md rounded-full text-light-on-surface-variant font-label text-label-lg transition-colors duration-state-change ease-state-change';
          heading.textContent = 'Welcome back';
          sub.textContent = 'Sign in to keep your workout days and PR history synced.';
          submitLabel.textContent = 'Sign In';
          forgotLink.classList.remove('hidden');
        }
      }

      if (tabSignIn && tabSignUp) {
        tabSignIn.addEventListener('click', function () { setMode(false); });
        tabSignUp.addEventListener('click', function () { setMode(true); });
      }

      if (togglePw && pwInput && pwIcon) {
        togglePw.addEventListener('click', function () {
          const isPw = pwInput.type === 'password';
          pwInput.type = isPw ? 'text' : 'password';
          pwIcon.textContent = isPw ? 'visibility_off' : 'visibility';
        });
      }
    })();
  </script>
