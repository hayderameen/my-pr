  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <div class="min-h-[884px] max-w-md mx-auto flex flex-col justify-between px-page-margin py-gutter-xl bg-light-surface" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Step Header -->
    <header class="flex items-center justify-between gap-gutter-md pt-gutter-sm">
      <div class="flex items-center gap-gutter-xs">
        <span class="w-8 h-1.5 rounded-full bg-light-primary inline-block"></span>
        <span class="w-8 h-1.5 rounded-full bg-light-surface-container-highest inline-block"></span>
      </div>
      <a href="../workout-day-picker/WorkoutDayPicker.html" class="font-label text-label-lg text-light-on-surface-variant" data-design-text-token="label-lg">Skip</a>
    </header>

    <!-- Main Onboarding Selection -->
    <main class="flex-1 flex flex-col justify-center gap-gutter-xl py-gutter-xl">

      <section class="flex flex-col gap-gutter-xs">
        <h1 class="font-display text-display-lg-mobile text-light-on-surface text-balance" data-design-text-token="display-lg-mobile">Pick your weight unit</h1>
        <p class="font-body text-body-md text-light-on-surface-variant text-pretty" data-design-text-token="body-md">This sets your ruling scale increments and barbell plate breakdown. You can switch anytime.</p>
      </section>

      <!-- Unit Choice Cards -->
      <section aria-label="Weight unit options" class="flex flex-col gap-gutter-md">

        <!-- Kilograms (Selected) -->
        <button id="unit-kg" type="button" data-component-id="card-interactive-2" data-component-type="card" data-component-variant="interactive" aria-pressed="true" class="w-full text-left bg-light-primary text-light-on-primary rounded-xl p-gutter-xl flex items-center justify-between gap-gutter-md transition-transform duration-state-change ease-state-change active:scale-95">
          <div class="flex flex-col gap-gutter-xs">
            <span class="font-headline text-headline-md" data-design-text-token="headline-md">Kilograms (kg)</span>
            <span class="font-mono text-mono-sm text-light-on-primary/90" data-design-text-token="mono-sm">20 kg bar • 2.5 kg ruler steps</span>
          </div>
          <span id="kg-check" class="material-symbols-outlined" aria-hidden="true">check_circle</span>
        </button>

        <!-- Pounds -->
        <button id="unit-lbs" type="button" data-component-id="card-interactive" data-component-type="card" data-component-variant="interactive" aria-pressed="false" class="w-full text-left bg-light-surface-container-lowest text-light-on-surface border border-light-outline-variant rounded-xl p-gutter-xl flex items-center justify-between gap-gutter-md transition-transform duration-state-change ease-state-change hover:bg-light-surface-container-low active:scale-95">
          <div class="flex flex-col gap-gutter-xs">
            <span class="font-headline text-headline-md" data-design-text-token="headline-md">Pounds (lbs)</span>
            <span class="font-mono text-mono-sm text-light-on-surface-variant" data-design-text-token="mono-sm">45 lb bar • 5 lb ruler steps</span>
          </div>
          <span id="lbs-check" class="material-symbols-outlined text-light-outline" aria-hidden="true">radio_button_unchecked</span>
        </button>

      </section>

      <!-- Default Barbell Summary -->
      <article data-component-id="card-elevated" data-component-type="card" data-component-variant="elevated" class="bg-light-surface-container-lowest border border-light-outline-variant rounded-xl p-gutter-lg flex items-center justify-between gap-gutter-md">
        <div class="flex items-center gap-gutter-md">
          <span class="material-symbols-outlined text-light-primary" aria-hidden="true">fitness_center</span>
          <div class="flex flex-col gap-gutter-xs">
            <span class="font-title text-title-md text-light-on-surface" data-design-text-token="title-md">Standard Barbell</span>
            <span id="bar-desc" class="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">20 kg Olympic bar</span>
          </div>
        </div>
        <span id="bar-badge" class="font-mono text-mono-sm text-light-on-surface-variant" data-design-text-token="mono-sm">IPF</span>
      </article>

    </main>

    <!-- Primary Continue Action -->
    <footer class="pb-gutter-md">
      <a href="../workout-day-picker/WorkoutDayPicker.html" data-component-id="button-with-icon" data-component-type="button" data-component-variant="with-icon" class="w-full inline-flex items-center justify-center gap-gutter-sm bg-light-primary text-light-on-primary px-gutter-xl py-gutter-lg rounded-full font-label text-label-lg transition-transform duration-state-change ease-state-change hover:bg-light-primary-container active:scale-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary">
        <span data-design-text-token="label-lg">Start Lifting</span>
        <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
      </a>
    </footer>

  </div>

  <script>
    (function () {
      const btnKg = document.getElementById('unit-kg');
      const btnLbs = document.getElementById('unit-lbs');
      const kgCheck = document.getElementById('kg-check');
      const lbsCheck = document.getElementById('lbs-check');
      const barDesc = document.getElementById('bar-desc');
      const barBadge = document.getElementById('bar-badge');

      function selectUnit(unit) {
        const isKg = unit === 'kg';
        btnKg.setAttribute('aria-pressed', String(isKg));
        btnLbs.setAttribute('aria-pressed', String(!isKg));

        if (isKg) {
          btnKg.className = 'w-full text-left bg-light-primary text-light-on-primary rounded-xl p-gutter-xl flex items-center justify-between gap-gutter-md transition-transform duration-state-change ease-state-change active:scale-95';
          btnKg.querySelector('span:nth-child(2)').className = 'font-mono text-mono-sm text-light-on-primary/90';
          kgCheck.textContent = 'check_circle';
          kgCheck.className = 'material-symbols-outlined';

          btnLbs.className = 'w-full text-left bg-light-surface-container-lowest text-light-on-surface border border-light-outline-variant rounded-xl p-gutter-xl flex items-center justify-between gap-gutter-md transition-transform duration-state-change ease-state-change hover:bg-light-surface-container-low active:scale-95';
          btnLbs.querySelector('span:nth-child(2)').className = 'font-mono text-mono-sm text-light-on-surface-variant';
          lbsCheck.textContent = 'radio_button_unchecked';
          lbsCheck.className = 'material-symbols-outlined text-light-outline';

          barDesc.textContent = '20 kg Olympic bar';
          barBadge.textContent = 'IPF';
        } else {
          btnLbs.className = 'w-full text-left bg-light-primary text-light-on-primary rounded-xl p-gutter-xl flex items-center justify-between gap-gutter-md transition-transform duration-state-change ease-state-change active:scale-95';
          btnLbs.querySelector('span:nth-child(2)').className = 'font-mono text-mono-sm text-light-on-primary/90';
          lbsCheck.textContent = 'check_circle';
          lbsCheck.className = 'material-symbols-outlined';

          btnKg.className = 'w-full text-left bg-light-surface-container-lowest text-light-on-surface border border-light-outline-variant rounded-xl p-gutter-xl flex items-center justify-between gap-gutter-md transition-transform duration-state-change ease-state-change hover:bg-light-surface-container-low active:scale-95';
          btnKg.querySelector('span:nth-child(2)').className = 'font-mono text-mono-sm text-light-on-surface-variant';
          kgCheck.textContent = 'radio_button_unchecked';
          kgCheck.className = 'material-symbols-outlined text-light-outline';

          barDesc.textContent = '45 lb Standard bar';
          barBadge.textContent = 'US';
        }
      }

      if (btnKg && btnLbs) {
        btnKg.addEventListener('click', function () { selectUnit('kg'); });
        btnLbs.addEventListener('click', function () { selectUnit('lbs'); });
      }
    })();
  </script>


</body></html>
